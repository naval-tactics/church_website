<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Registration - South B Police Chapel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,sans-serif}
.heaven-bg{background:url('/static/uploads/god_key.jpg') no-repeat center center fixed;background-size:cover}
.glass-panel{backdrop-filter:blur(20px);background:rgba(255,255,255,0.97);border:1px solid rgba(255,255,255,0.7);box-shadow:0 8px 32px rgba(0,0,0,0.08)}
.step-active{background:#0f172a!important;color:#fff!important;font-weight:600}
.input{border:1px solid #e5e7eb;padding:12px 16px;border-radius:12px;font-size:13px;background:white;width:100%;outline:none}
.input:focus{border-color:#0f172a}
.photo-preview{width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #e5e7eb;background:#f3f4f6}
</style>
</head>
<body class="heaven-bg min-h-screen">
<div class="min-h-screen bg-white/20 py-6">
<nav class="max-w-4xl mx-auto bg-[#0f172a] text-white px-6 py-3 rounded-full flex justify-between items-center">
<div class="font-medium text-xs">South B Police Chapel</div>
<div class="flex gap-2">
<a href="/member-qualifications" class="text-[11px] bg-white/10 px-3 py-1.5 rounded-full">Qualifications</a>
<a href="/" class="text-[11px] bg-white text-black px-3 py-1.5 rounded-full">Home</a>
</div>
</nav>

<div class="max-w-4xl mx-auto mt-6 px-4">
  <div class="glass-panel rounded-2xl p-6 md:p-8">
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-[#0f172a]">Member Registration</h1>
      <p class="text-xs text-gray-500 mt-2">Please provide your details to join the chapel</p>
    </div>

    <div class="flex justify-between items-center gap-2 mb-6">
      <div class="flex gap-2">
        <button onclick="goStep(1)" id="s1" class="step-active px-5 py-2 rounded-full text-xs">Personal Details</button>
        <button onclick="goStep(2)" id="s2" class="bg-white border px-5 py-2 rounded-full text-xs">Ministry & Emergency</button>
      </div>
      <button onclick="closeRegistration()" class="bg-gray-100 w-8 h-8 rounded-full text-sm">✕</button>
    </div>

    <form id="memberForm" enctype="multipart/form-data">
      <div id="step1" class="step space-y-5">
        <div class="bg-gray-50 border rounded-xl p-5 flex gap-5 items-center flex-wrap">
          <img id="photoPreview" src="https://via.placeholder.com/110x110.png?text=Photo" class="photo-preview">
          <div class="flex-1 min-w-[240px]">
            <label class="text-xs font-medium">Photo *</label>
            <input id="photo" type="file" accept="image/*" required class="w-full mt-2 text-xs bg-white p-2.5 rounded-xl border">
            <p class="text-[11px] text-gray-500 mt-2">Clear face photo. Max 5MB.</p>
          </div>
        </div>

        <div>
          <label class="text-[11px] font-medium text-gray-700">Full Names *</label>
          <input id="fullName" required placeholder="Enter full names" class="input mt-1">
        </div>

        <div>
          <label class="text-[11px] font-medium text-gray-700">Phone Number *</label>
          <input id="phone" type="tel" required placeholder="0712 345 678" class="input mt-1">
        </div>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="text-[11px] font-medium text-gray-700">Username *</label>
            <input id="username" required placeholder="Username for login" class="input mt-1">
          </div>
          <div>
            <label class="text-[11px] font-medium text-gray-700">Email *</label>
            <input id="regEmail" type="email" required placeholder="Email address" class="input mt-1">
          </div>
          <div>
            <label class="text-[11px] font-medium text-gray-700">Password *</label>
            <input id="password" type="password" required placeholder="Minimum 6 characters" class="input mt-1">
          </div>
          <div>
            <label class="text-[11px] font-medium text-gray-700">Confirm Password *</label>
            <input id="confirmPassword" type="password" required placeholder="Confirm password" class="input mt-1">
          </div>
        </div>
      </div>

      <div id="step2" class="step hidden space-y-5">
        <div class="grid md:grid-cols-2 gap-5">
          <div class="border rounded-xl p-5 bg-white">
            <h3 class="font-medium text-sm">Ministry / Department *</h3>
            <select id="preferredMinistry" required class="input mt-3">
              <option value="">Select ministry</option>
              <option>Choir / Worship</option>
              <option>Ushering</option>
              <option>Youth Ministry</option>
              <option>Sunday School</option>
              <option>Media / Sound</option>
              <option>Intercession / Prayer</option>
              <option>Evangelism</option>
              <option>Women Ministry</option>
              <option>Men Ministry</option>
              <option>Other</option>
            </select>
          </div>

          <div class="border rounded-xl p-5 bg-white">
            <h3 class="font-medium text-sm">Emergency Contact *</h3>
            <div class="mt-3 space-y-3">
              <div>
                <label class="text-[10px] font-medium text-gray-600">Full Name *</label>
                <input id="emergencyName" required placeholder="Contact full name" class="input mt-1">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="text-[10px] font-medium text-gray-600">Relationship *</label>
                  <select id="emergencyRel" required class="input mt-1">
                    <option value="">Select</option>
                    <option>Spouse</option>
                    <option>Parent</option>
                    <option>Sibling</option>
                    <option>Friend</option>
                    <option>Pastor</option>
                    <option>Relative</option>
                  </select>
                </div>
                <div>
                  <label class="text-[10px] font-medium text-gray-600">Phone Number *</label>
                  <input id="emergencyPhone" required placeholder="Phone number" class="input mt-1">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-gray-50 border rounded-xl p-4">
          <label class="flex gap-3 items-start text-xs cursor-pointer">
            <input type="checkbox" id="terms" required class="mt-1">
            <span>I confirm my information is accurate and I agree to the chapel terms.</span>
          </label>
        </div>
      </div>

      <div class="flex justify-between mt-8">
        <button type="button" onclick="prevStep()" id="prevBtn" class="bg-white border px-6 py-2.5 rounded-full text-xs hidden">Back</button>
        <div class="ml-auto flex gap-2">
          <button type="button" onclick="nextStep()" id="nextBtn" class="bg-[#0f172a] text-white px-8 py-2.5 rounded-full text-xs">Next</button>
          <button type="submit" id="submitBtn" class="hidden bg-[#0f172a] text-white px-8 py-2.5 rounded-full text-xs">Submit Registration</button>
        </div>
      </div>
      <p id="msg" class="text-center text-xs mt-4 min-h-[20px] text-red-600"></p>
    </form>
  </div>
</div>
</div>

<div id="successModal" class="hidden fixed inset-0 z-[200] bg-black/60 backdrop-blur flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-8 w-full max-w-md text-center">
    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mx-auto">✓</div>
    <h3 class="font-semibold text-base mt-4">Registration Submitted</h3>
    <p class="text-xs text-gray-600 mt-2">Your request has been received and is pending review.</p>
    <p class="text-xs font-medium mt-3 bg-gray-50 border p-3 rounded-xl">ID: <span id="successId">-</span></p>
    <div class="flex gap-2 mt-6">
      <button onclick="closeSuccessAndRedirect()" class="flex-1 bg-[#0f172a] text-white py-2.5 rounded-full text-xs">Go Home</button>
      <button onclick="closeSuccessStay()" class="flex-1 bg-white border py-2.5 rounded-full text-xs">Close</button>
    </div>
  </div>
</div>

<script>
let cur=1;
function goStep(n){ document.querySelectorAll('.step').forEach(s=>s.classList.add('hidden')); document.getElementById('step'+n).classList.remove('hidden'); document.querySelectorAll('[id^=s]').forEach(b=>{ if(b.id==='s1'||b.id==='s2') b.className='bg-white border px-5 py-2 rounded-full text-xs'; }); document.getElementById('s'+n).className='step-active px-5 py-2 rounded-full text-xs'; cur=n; updateBtns(); }
function nextStep(){
  if(cur===1){
    if(!document.getElementById('fullName').value.trim()){ alert('Full Name required'); return; }
    if(!document.getElementById('phone').value.trim()){ alert('Phone Number required'); return; }
    if(!document.getElementById('photo').files[0]){ alert('Photo required'); return; }
    if(!document.getElementById('username').value.trim()){ alert('Username required'); return; }
    if(!document.getElementById('regEmail').value.includes('@')){ alert('Valid email required'); return; }
    if(document.getElementById('password').value.length<6){ alert('Password min 6 chars'); return; }
    if(document.getElementById('password').value!==document.getElementById('confirmPassword').value){ alert('Passwords do not match'); return; }
  }
  if(cur<2){ goStep(cur+1); }
}
function prevStep(){ if(cur>1){ goStep(cur-1); } }
function updateBtns(){ document.getElementById('prevBtn').classList.toggle('hidden', cur===1); document.getElementById('nextBtn').classList.toggle('hidden', cur===2); document.getElementById('submitBtn').classList.toggle('hidden', cur!==2); }
function closeRegistration(){ if(confirm('Close registration?')){ window.location.href='/'; } }
function closeSuccessAndRedirect(){ document.getElementById('successModal').classList.add('hidden'); window.location.href='/'; }
function closeSuccessStay(){ document.getElementById('successModal').classList.add('hidden'); document.getElementById('memberForm').reset(); document.getElementById('photoPreview').src='https://via.placeholder.com/110x110.png?text=Photo'; goStep(1); document.getElementById('msg').innerText=''; }

document.getElementById('photo').addEventListener('change', e=>{
  const f=e.target.files[0];
  if(f){
    if(f.size > 5*1024*1024){ alert('Photo max 5MB'); e.target.value=''; return; }
    const r=new FileReader(); r.onload=ev=>{ document.getElementById('photoPreview').src=ev.target.result; }; r.readAsDataURL(f);
  }
});
document.getElementById('memberForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  if(!document.getElementById('phone').value.trim()){ document.getElementById('msg').innerText='Phone Number required'; return; }
  if(!document.getElementById('preferredMinistry').value){ document.getElementById('msg').innerText='Select Ministry'; return; }
  if(!document.getElementById('emergencyName').value.trim() || !document.getElementById('emergencyPhone').value.trim()){ document.getElementById('msg').innerText='Emergency contact required'; return; }
  if(!document.getElementById('terms').checked){ document.getElementById('msg').innerText='Accept Terms'; return; }

  const payload={
    personal:{ fullName: document.getElementById('fullName').value.trim(), phone: document.getElementById('phone').value.trim() },
    contact:{ phone: document.getElementById('phone').value.trim(), email: document.getElementById('regEmail').value },
    ministry:{ department: document.getElementById('preferredMinistry').value, preferredMinistry: document.getElementById('preferredMinistry').value },
    emergency:{ name: document.getElementById('emergencyName').value.trim(), relationship: document.getElementById('emergencyRel').value, phone: document.getElementById('emergencyPhone').value.trim() },
    username: document.getElementById('username').value.trim(),
    email: document.getElementById('regEmail').value.trim(),
    password: document.getElementById('password').value
  };

  const fd=new FormData();
  fd.append('photo', document.getElementById('photo').files[0]);
  fd.append('data', JSON.stringify(payload));
  fd.append('username', payload.username);
  fd.append('email', payload.email);
  fd.append('password', payload.password);
  fd.append('fullName', payload.personal.fullName);
  fd.append('phone', payload.personal.phone);
  fd.append('phoneNumber', payload.personal.phone);
  fd.append('ministry_department', payload.ministry.department);
  fd.append('emergency_name', payload.emergency.name);
  fd.append('emergency_phone', payload.emergency.phone);
  fd.append('emergency_relationship', payload.emergency.relationship);
  fd.append('personal', JSON.stringify(payload.personal));
  fd.append('contact', JSON.stringify(payload.contact));
  fd.append('ministry', JSON.stringify(payload.ministry));
  fd.append('emergency', JSON.stringify(payload.emergency));

  document.getElementById('msg').innerText='Submitting...';
  try{
    const r=await fetch('/api/member/register',{method:'POST',body:fd});
    const j=await r.json();
    if(j.ok){ document.getElementById('successId').innerText=j.id; document.getElementById('successModal').classList.remove('hidden'); document.getElementById('msg').innerText=''; }
    else { document.getElementById('msg').innerText=j.error||'Failed'; }
  }catch(err){ document.getElementById('msg').innerText='Network error'; }
});
updateBtns();
</script>
</body>
</html>
